[package]
name = "hfs-check"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
getrandom = "0.2"
base64 = "0.22"
